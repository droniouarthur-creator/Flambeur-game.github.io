const NAME="Flambeur !";document.title=NAME;
const LOGO=`<svg viewBox="0 0 120 120" role="img" aria-label="Logo Flambeur : un jeton de casino orné d’une flamme">
<circle cx="60" cy="60" r="56" fill="#b8261e" stroke="#f3ca65" stroke-width="2"/>
<circle cx="60" cy="60" r="48" fill="none" stroke="#f3ca65" stroke-width="5" stroke-dasharray="10 8"/>
<path d="M60 14 L64 24 L56 24 Z" fill="#f3ca65"/><path d="M60 106 L64 96 L56 96 Z" fill="#f3ca65"/>
<path d="M14 60 L24 64 L24 56 Z" fill="#f3ca65"/><path d="M106 60 L96 64 L96 56 Z" fill="#f3ca65"/>
<circle cx="60" cy="60" r="38" fill="#2a080c" stroke="#f3ca65" stroke-width="2.5"/>
<path d="M60 28 C66 40 78 46 78 62 C78 74 70 84 60 84 C50 84 42 74 42 62 C42 54 47 50 50 44 C52 50 55 52 58 52 C58 44 56 36 60 28 Z" fill="url(#goldGrad)" stroke="#f3ca65" stroke-width="1"/>
<path d="M60 52 C64 58 69 61 69 68 C69 74 65 78 60 78 C55 78 51 74 51 68 C51 62 56 60 60 52 Z" fill="#ff3b30"/>
<path d="M30 65 Q 60 95 90 65" fill="none" stroke="#f3ca65" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="60" y="78" fill="#f3ca65" font-family="Georgia, serif" font-size="11.5" font-weight="bold" text-anchor="middle" letter-spacing="1.5">FLAMBEUR</text>
<defs><linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff2b2"/><stop offset="100%" stop-color="#d4af37"/></linearGradient></defs>
</svg>`;

const JK={miroir:["Le Miroir","À ton tour, réorganise comme tu veux les chiffres de la dernière mise, même si le nombre baisse."],
regard:["Le Regard Indiscret","Regarde les jokers d’un adversaire et interdis-lui d’en utiliser un jusqu’à la fin de la manche."],
fourchette:["La Fourchette Forcée","Après ta mise, impose au joueur suivant une fourchette serrée que tu définis."],
jackpot:["Le Jackpot","Joué en criant « Flambeur ! » : tous les points de la manche sont doublés."],
inflation:["L’Inflation de crise","Pas de mise minimale ce tour : tu peux annoncer le même nombre ou à peine plus."]};

let CUS=[],REQ=[],S={screen:"setup",names:["Joueur 1","Joueur 2","Joueur 3"],err:"",modal:null,mode:null,showJk:false,f:{},qerr:"",exp:"",devMode:false};

try{
 const t=JSON.parse(localStorage.getItem("fl_names")||"null");if(Array.isArray(t)&&t.length>=3)S.names=t.slice(0,10);
 const c=JSON.parse(localStorage.getItem("fl_custom")||"null");if(Array.isArray(c))CUS=c;
 const r=JSON.parse(localStorage.getItem("fl_requests")||"null");if(Array.isArray(r))REQ=r;
}catch(e){}

const saveC=()=>{try{localStorage.setItem("fl_custom",JSON.stringify(CUS))}catch(e){}},
      saveR=()=>{try{localStorage.setItem("fl_requests",JSON.stringify(REQ))}catch(e){}};

const all=()=>BASE.concat(CUS),last=()=>S.bids.length?S.bids[S.bids.length-1].v:null;

function start(){
 try{localStorage.setItem("fl_names",JSON.stringify(S.names))}catch(e){}
 S.players=S.names.map((n,i)=>({name:n.trim()||"Joueur "+(i+1),pts:0,jk:shuf(Object.keys(JK)).slice(0,2)}));
 S.deck=[];S.start=Math.floor(Math.random()*S.players.length);S.winner=null;round()
}

function round(){
 if(!S.deck.length)S.deck=shuf(all());
 S.q=S.deck.pop();S.bids=[];S.last=-1;S.cur=S.start;S.range=null;S.nextRange=null;S.banned={};S.mode=null;S.showJk=false;S.err="";S.modal=null;S.screen="round";render()
}

const sb=()=>`<div class="sb">${S.players.map((p,i)=>`<div class="chip ${S.screen==="round"&&i===S.cur?"on":""}"><span>${esc(p.name)}</span><b>${p.pts}</b></div>`).join("")}</div>`;

function setupH(){
 return `<div class="hero">${LOGO}<h1>${esc(NAME)}</h1><p>Estime, surenchéris, flambe. Un seul téléphone, 3 à 10 joueurs, premier à 5 points.</p></div>
<div class="card"><h2>Joueurs</h2>${S.names.map((n,i)=>`<div class="row" style="margin:6px 0"><input type="text" class="grow" data-n="${i}" value="${esc(n)}" aria-label="Nom du joueur ${i+1}" maxlength="16">${S.names.length>3?`<button class="btn" data-a="del" data-i="${i}" aria-label="Retirer ${esc(n)}">Retirer</button>`:""}</div>`).join("")}
<div class="row" style="margin-top:10px">${S.names.length<10?`<button class="btn" data-a="add">Ajouter un joueur</button>`:""}<button class="btn pri" data-a="go">Lancer la partie</button></div></div>

<div class="card" style="border-style: dashed;">
  <h2>Espace Modérateur / Développeur</h2>
  ${S.devMode ? 
    `<p style="color:var(--gold);font-weight:bold;">Mode Développeur Actif ✅</p>
     <button class="btn pri" style="width:100%" data-a="qs">Gérer les questions (${all().length} actives, ${REQ.length} en attente)</button>
     <button class="btn red" style="width:100%;margin-top:8px" data-a="dev-logout">Verrouiller le mode dev</button>` :
    `<p class="mut">Réservé au créateur pour accepter les requêtes et modifier les questions (Code PIN requis).</p>
     <label for="pin-code">Entrer le code PIN</label>
     <div class="row"><input type="password" id="pin-code" inputmode="numeric" maxlength="4" class="grow"><button class="btn pri" data-a="dev-login">Déverrouiller</button></div>`
  }
</div>

<div class="card">
  <h2>Suggérer une question</h2>
  <p class="mut">Tu es joueur ou inconnu ? Propose une question pour enrichir le jeu ! Elle sera soumise au modérateur.</p>
  <button class="btn" style="width:100%" data-a="open-sug">Proposer une question</button>
</div>

<details class="card"><summary>Règles en bref</summary>
<p>Une question à réponse numérique est lue à voix haute. Le premier joueur annonce un nombre, puis chacun surenchérit ou crie « Flambeur ! ». Pas de passe.</p>
<p><b>Mise minimale :</b> ajoute 1 au deuxième chiffre (42 → 43, 353 → 363, 990 → 1 000). Tu peux monter bien plus haut.</p>
<p><b>Flambeur !</b> L’accusé est le dernier à avoir misé. Si sa mise dépasse la réponse, l’accusateur gagne 1 point et l’accusé en perd 1. Sinon (égalité comprise), l’accusé gagne 1 point et l’accusateur en perd 1. Mise exacte : l’accusé gagne 2 points.</p>
<p>Le perdant de la manche commence la suivante. Chaque joueur a 2 jokers secrets au départ, jouables une fois.</p></details>`}

function suggestH(){
 const f=S.f;
 return `<h1>Proposer une question</h1><p class="mut">Envoie ta question au créateur du jeu.</p>
<div class="card">
<label for="nq">Question</label><textarea id="nq" rows="3">${esc(f.q||"")}</textarea>
<div class="row"><div class="grow"><label for="nu">Unité</label><input type="text" id="nu" value="${esc(f.u||"")}" placeholder="ex. mètres"></div><div class="grow"><label for="na">Réponse (entier à partir de 1)</label><input type="number" id="na" inputmode="numeric" value="${esc(f.a||"")}"></div></div>
<label for="ns">Source</label><input type="text" id="ns" value="${esc(f.s||"")}">
<label for="ne">Effet pour le perdant (facultatif)</label><input type="text" id="ne" value="${esc(f.e||"")}" placeholder="parle en rimes pendant la manche suivante">
<label class="row"><input type="checkbox" id="nv" ${f.v?"checked":""}> Réponse à revérifier</label>
<p class="err" role="alert">${esc(S.qerr)}</p>
<button class="btn pri" style="width:100%;margin-top:10px" data-a="qreq">Envoyer la proposition</button></div>
<button class="btn" style="width:100%;margin-top:10px" data-a="menu">Retour au menu</button>`}

function qsH(){
 const f=S.f;
 return `<h1>Gestion des questions (Développeur)</h1><p class="mut">Gère les questions validées et valide les requêtes externes.</p>
${REQ.length?`<div class="card"><h2>Requêtes en attente (${REQ.length})</h2>${REQ.map((c,i)=>`<div class="card" style="background:var(--bg);margin:6px 0"><span><b>${esc(c.q)}</b><br>Réponse : <b>${fmt(c.a)} ${esc(c.u)}</b> (${esc(c.s||"source non précisée")})</span><div class="row" style="margin-top:8px"><button class="btn pri" data-a="reqacc" data-i="${i}">Accepter</button><button class="btn red" data-a="reqrej" data-i="${i}">Rejeter</button></div></div>`).join("")}</div>`:""}

${CUS.length?`<div class="card"><h2>Questions personnalisées (${CUS.length})</h2>${CUS.map((c,i)=>`<div class="row" style="justify-content:space-between;margin:8px 0"><span>${esc(c.q)} <b>${fmt(c.a)}</b></span><button class="btn red" data-a="qdel" data-i="${i}" aria-label="Supprimer la question ${i+1}">Supprimer</button></div>`).join("")}</div>`:""}

<div class="card"><h2>Sauvegarder ou partager</h2><p class="mut">Exporte tes questions pour les garder en sécurité ou les importer ailleurs.</p>
<button class="btn" data-a="qexp">Exporter</button>${S.exp?`<textarea readonly rows="5" style="margin-top:8px" aria-label="Questions exportées">${esc(S.exp)}</textarea>`:""}
<label for="imp">Importer</label><textarea id="imp" rows="3"></textarea><button class="btn" style="margin-top:8px" data-a="qimp">Importer</button></div>
<button class="btn pri" data-a="menu" style="width:100%;margin-top:10px">Retour au menu</button>`}

function roundH(){
 const p=S.players[S.cur],L=last(),m=S.mode;
 const mn=m==="inflation"&&L!==null?L:(L===null?1:minRaise(L));
 const hist=S.bids.slice(-4).map(b=>`${esc(b.n)} : ${fmt(b.v)}`).join(" · ");
 const avail=p.jk.filter(k=>!(S.banned[S.cur]||[]).includes(k)),ban=(S.banned[S.cur]||[]).filter(k=>p.jk.includes(k));
 return sb()+`<div class="qc"><p class="mut">Réponse en ${esc(S.q.u)}</p><p class="q">${esc(S.q.q)}</p>${S.q.e?`<p class="mut">Carte à effet : le perdant de cette manche ${esc(S.q.e)}.</p>`:""}</div>
<div class="card"><p class="mut">${L===null?"Première mise":"Dernière mise, par "+esc(S.bids[S.bids.length-1].n)}</p><div class="bid"><p class="big">${L===null?"—":fmt(L)}</p></div><p class="hist">${hist}</p></div>
<div class="card"><h2>À ${esc(p.name)} de jouer</h2>
<p class="mut">Mise minimale : <b>${fmt(mn)}</b>${S.range?` · fourchette imposée : ${fmt(S.range.lo)} à ${fmt(S.range.hi)}`:""}${m==="miroir"?" · Miroir : mêmes chiffres, ordre libre":""}</p>
<input type="number" id="bid" inputmode="numeric" min="1" step="1" placeholder="Ta mise" aria-label="Ta mise">
${m==="fourchette"?`<div class="row" style="margin-top:8px"><input type="number" id="lo" inputmode="numeric" placeholder="Fourchette : de" aria-label="Début de fourchette"><input type="number" id="hi" inputmode="numeric" placeholder="à" aria-label="Fin de fourchette"></div>`:""}
<p class="err" role="alert">${esc(S.err)}</p>
<div class="row"><button class="btn pri grow" data-a="bid">Surenchérir</button><button class="btn red grow" data-a="acc" ${L===null?"disabled":""}>Flambeur !</button></div>
<div class="row" style="margin-top:10px"><button class="btn" data-a="jk">Mes jokers (${p.jk.length})</button>${m?`<button class="btn" data-a="nomode">Annuler le joker</button>`:""}</div>
${S.showJk?`<p class="up">Tiens le téléphone pour que personne ne voie ton écran.</p>${p.jk.length?"":"<p class=mut>Plus de joker.</p>"}${avail.map(k=>`<div class="jk"><b>${JK[k][0]}</b><p>${JK[k][1]}</p>${k==="jackpot"?`<span class="mut">Se joue au moment de crier « Flambeur ! ».</span>`:`<button class="btn pri" data-a="play" data-k="${k}" ${(k==="miroir"||k==="inflation")&&L===null?"disabled":""}>Jouer</button>`}</div>`).join("")}${ban.map(k=>`<div class="jk mut">${JK[k][0]} — interdit pour cette manche</div>`).join("")}`:""}</div>`+modalH()}

function modalH(){
 const M=S.modal;if(!M)return"";let h="";
 if(M.t==="acc"){h=`<h2>Qui crie « Flambeur ! » ?</h2><p class="mut">Accusé : ${esc(S.players[S.last].name)}</p>`+S.players.map((p,i)=>i===S.last?"":`<button class="btn" data-a="res" data-i="${i}" data-j="0">${esc(p.name)}</button>${p.jk.includes("jackpot")&&!(S.banned[i]||[]).includes("jackpot")?`<button class="btn" data-a="res" data-i="${i}" data-j="1">${esc(p.name)} avec le Jackpot (points ×2)</button>`:""}`).join("")}
 else if(M.t==="rg"&&M.op==null){h=`<h2>Regarder les jokers de qui ?</h2>`+S.players.map((p,i)=>i===S.cur?"":`<button class="btn" data-a="rgop" data-i="${i}">${esc(p.name)}</button>`).join("")}
 else if(M.t==="rg"){const o=S.players[M.op];h=`<h2>Jokers de ${esc(o.name)}</h2>${o.jk.length?"<p>Interdis-lui un joker pour cette manche, ou aucun.</p>":"<p>Aucun joker.</p>"}`+o.jk.map(k=>`<button class="btn red" data-a="ban" data-k="${k}">Interdire ${JK[k][0]}</button>`).join("")+`<button class="btn" data-a="ban" data-k="">Ne rien interdire</button>`}
 return `<div class="modal" role="dialog" aria-modal="true"><div>${h}<button class="btn" data-a="close" style="margin-top:12px">Fermer</button></div></div>`}

function resolve(ai,jp){
 const cu=S.players[S.last],bid=last(),ans=S.q.a,k=jp?2:1,d=S.players.map(()=>0);let txt,lo;
 if(bid>ans){d[ai]+=k;d[S.last]-=k;lo=S.last;txt=`Accusation réussie : la mise de ${esc(cu.name)} dépassait la réponse.`}
 else{const ex=bid===ans;d[S.last]+=(ex?2:1)*k;d[ai]-=k;lo=ai;txt=ex?`Mise exacte ! ${esc(cu.name)} marque le bonus de précision.`:`Accusation ratée : ${esc(cu.name)} était en dessous ou à égalité.`}
 if(S.q.x)d[lo]-=1;
 if(jp){const a=S.players[ai].jk.indexOf("jackpot");S.players[ai].jk.splice(a,1)}
 S.players.forEach((p,i)=>p.pts+=d[i]);
 const top=Math.max(...S.players.map(p=>p.pts));S.winner=top>=5?S.players.findIndex(p=>p.pts===top):null;
 S.res={txt,d,lo,bid,jp};S.start=lo;S.modal=null;S.screen="reveal";render()
}

function revealH(){
 const r=S.res,q=S.q;
 return sb()+`<div class="qc"><p class="mut">La réponse était</p><div class="bid"><p class="big">${fmt(q.a)}</p></div><p class="mut">${esc(q.u)} — source : ${esc(q.s||"non précisée")}</p></div>
${q.v?`<div class="ban"><b>À revérifier.</b> ${q.v===true?"Réponse à confirmer avant de s’y fier.":esc(q.v)}</div>`:""}
<div class="card"><p>Dernière mise : <b>${fmt(r.bid)}</b></p><p><b>${r.txt}</b>${r.jp?" Jackpot : points doublés.":""}</p><p>${S.players.map((p,i)=>r.d[i]?`${esc(p.name)} ${r.d[i]>0?"+":""}${r.d[i]}`:"").filter(Boolean).join(" · ")}</p>
${q.e?`<div class="ban"><b>Carte à effet.</b> ${esc(S.players[r.lo].name)} ${esc(q.e)}.</div>`:""}</div>
<button class="btn pri" style="width:100%" data-a="${S.winner!=null?"end":"next"}">${S.winner!=null?"Voir le vainqueur":"Manche suivante — "+esc(S.players[S.start].name)+" commence"}</button>`}

function endH(){
 const w=S.players[S.winner],r=S.players.slice().sort((a,b)=>b.pts-a.pts);
 return `<h1>${esc(w.name)} gagne !</h1><p class="mut" style="text-align:center">Premier à 5 points.</p><div class="card">${r.map(p=>`<div class="row" style="justify-content:space-between"><span>${esc(p.name)}</span><b>${p.pts}</b></div>`).join("")}</div><div class="row"><button class="btn pri grow" data-a="again">Rejouer</button><button class="btn grow" data-a="menu">Menu</button></div>`}

function render(){
 const app=$("#app");
 if(S.screen==="setup") app.innerHTML=setupH();
 else if(S.screen==="suggest") app.innerHTML=suggestH();
 else if(S.screen==="qs") app.innerHTML=qsH();
 else if(S.screen==="round") app.innerHTML=roundH();
 else if(S.screen==="reveal") app.innerHTML=revealH();
 else if(S.screen==="end") app.innerHTML=endH();
 window.scrollTo(0,0);
}

function bid(){
 const p=S.players[S.cur],L=last(),m=S.mode,v=parseInt($("#bid").value,10);let e="",nr=null;
 if(!(v>=1))e="Entre un nombre entier à partir de 1.";
 else if(L!==null){if(m==="miroir"){if(sig(v)!==sig(L))e="Utilise exactement les chiffres de la dernière mise."}
  else if(v<(m==="inflation"?L:minRaise(L)))e=`Mise minimale : ${fmt(m==="inflation"?L:minRaise(L))}.`}
 if(!e&&S.range&&(v<S.range.lo||v>S.range.hi))e=`Reste dans la fourchette imposée : ${fmt(S.range.lo)} à ${fmt(S.range.hi)}.`;
 if(!e&&m==="fourchette"){const lo=parseInt($("#lo").value,10),hi=parseInt($("#hi").value,10);
  if(!(lo>=minRaise(v)))e=`La fourchette doit commencer à ${fmt(minRaise(v))} ou plus.`;else if(!(hi>=lo))e="La fin de fourchette doit être au moins égale au début.";else nr={lo,hi}}
 if(e){S.err=e;render();return}
 if(m)p.jk.splice(p.jk.indexOf(m),1);
 S.bids.push({n:p.name,v});S.last=S.cur;S.range=nr;S.cur=(S.cur+1)%S.players.length;S.mode=null;S.showJk=false;S.err="";render()
}

function readF(){const g=i=>($(i)||{}).value||"";S.f={q:g("#nq"),u:g("#nu"),a:g("#na"),s:g("#ns"),e:g("#ne"),v:$("#nv")&&$("#nv").checked}}

function qreq(){
 readF();const f=S.f,a=parseInt(f.a,10);
 if(!f.q.trim()||!f.u.trim())S.qerr="Renseigne la question et l’unité.";
 else if(!(a>=1))S.qerr="La réponse doit être un entier à partir de 1.";
 else{const o={q:f.q.trim(),u:f.u.trim(),a,s:f.s.trim()};if(f.e.trim())o.e=f.e.trim();if(f.v)o.v=true;REQ.push(o);saveR();S.f={};S.qerr="";alert("Question proposée avec succès ! Merci.");S.screen="setup";render()}
}

function qimp(){
 let t;try{t=JSON.parse($("#imp").value)}catch(e){S.qerr="Texte illisible : colle exactement le texte exporté.";return render()}
 if(!Array.isArray(t)){S.qerr="Le texte doit être une liste de questions.";return render()}
 const ok=t.filter(c=>c&&typeof c.q==="string"&&typeof c.u==="string"&&Number.isInteger(c.a)&&c.a>=1);
 CUS=CUS.concat(ok);saveC();S.qerr=ok.length+" question(s) importée(s)";render()
}

const minRaise=n=>{const l=String(n).length;return l<2?n+1:n+Math.pow(10,l-2)},
      shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
      sig=n=>String(n).split("").sort().join(""),
      $=s=>document.querySelector(s),
      fmt=n=>Number(n).toLocaleString("fr-FR"),
      esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.addEventListener("input",e=>{const i=e.target.dataset.n;if(i!=null)S.names[i]=e.target.value});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
 if(a==="add")S.names.push("Joueur "+(S.names.length+1));
 else if(a==="del")S.names.splice(i,1);
 else if(a==="go")return start();
 else if(a==="open-sug"){S.screen="suggest";S.qerr=""}
 else if(a==="dev-login"){const pin=($("#pin-code")||{}).value;if(pin==="1234"){S.devMode=true;render();}else{alert("Code PIN incorrect");}}
 else if(a==="dev-logout"){S.devMode=false;render();}
 else if(a==="qs"){S.screen="qs";S.qerr="";S.exp=""}
 else if(a==="qreq")return qreq();
 else if(a==="reqacc"){CUS.push(REQ.splice(i,1)[0]);saveC();saveR()}
 else if(a==="reqrej"){REQ.splice(i,1);saveR()}
 else if(a==="qdel"){CUS.splice(i,1);saveC()}
 else if(a==="qexp")S.exp=JSON.stringify(CUS);
 else if(a==="qimp")return qimp();
 else if(a==="bid")return bid();
 else if(a==="acc")S.modal={t:"acc"};
 else if(a==="res")return resolve(i,b.dataset.j==="1");
 else if(a==="jk")S.showJk=!S.showJk;
 else if(a==="nomode")S.mode=null;
 else if(a==="play"){const k=b.dataset.k;if(k==="regard")S.modal={t:"rg",op:null};else S.mode=k;S.err=""}
 else if(a==="rgop")S.modal={t:"rg",op:i};
 else if(a==="ban"){const p=S.players[S.cur],k=b.dataset.k,o=S.modal.op;p.jk.splice(p.jk.indexOf("regard"),1);if(k)(S.banned[o]=S.banned[o]||[]).push(k);S.modal=null}
 else if(a==="close")S.modal=null;
 else if(a==="next")return round();
 else if(a==="end")S.screen="end";
 else if(a==="again")return start();
 else if(a==="menu")S.screen="setup";
 render()});
render();
</script></body></html>
